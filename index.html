<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<!--
  Runs immediately, before any CSS loads, so the very first pixel painted
  already matches the device's light/dark preference — otherwise a
  dark-mode user would see a bright white flash for a moment on every
  launch while the app's normal (async) theme logic in theme.js finishes
  loading its saved setting from storage. This is a best-effort guess
  only: theme.js still runs afterwards and applies the user's actual
  saved choice (light/dark/auto) once it's ready.
-->
<script>
(function () {
  try {
    var cachedMode = localStorage.getItem('theme_mode_cache') || 'auto';
    var resolved;
    if (cachedMode === 'dark' || cachedMode === 'light') {
      resolved = cachedMode;
    } else {
      resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', resolved);
  } catch (e) { /* localStorage/matchMedia unavailable — fall back to the default light theme */ }
})();
</script>
